name: Processar Planilha do SharePoint

on:
  push:
    paths:
      - 'data_raw/*.xlsx' # Dispara automaticamente quando você faz push/upload da planilha atualizada
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Regenerate data and docs
        run: |
          npm run sync-data
          npm run build:docs

      - name: Commit and Push (main)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data_processed docs
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): atualiza dados e docs com base na planilha mais recente" && git push)

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

